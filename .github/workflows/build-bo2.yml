name: Build XenDroid BO2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.30.3"

      - name: Install Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Patch BO2 network detection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "emulator-core/src/main/cpp/xenia/src/xenia/kernel/xam/xam_net.cc"
          )
          s = p.read_text()

          s = s.replace(
              "  return XnAddrStatus::XNET_GET_XNADDR_STATIC;",
              """  return XnAddrStatus::XNET_GET_XNADDR_ETHERNET |
                 XnAddrStatus::XNET_GET_XNADDR_STATIC;""",
              1
          )

          s = s.replace(
              """dword_result_t NetDll_XNetGetEthernetLinkStatus_entry(dword_t caller) {
            return 0;
          }""",
              """dword_result_t NetDll_XNetGetEthernetLinkStatus_entry(dword_t caller) {
            return XEthernetStatus::XNET_ETHERNET_LINK_ACTIVE |
                   XEthernetStatus::XNET_ETHERNET_LINK_100MBPS |
                   XEthernetStatus::XNET_ETHERNET_LINK_FULL_DUPLEX;
          }""",
              1
          )

          p.write_text(s)

          if "XNET_GET_XNADDR_ETHERNET |" not in s:
              raise SystemExit("XNetGetTitleXnAddr patch failed")

          if "XNET_ETHERNET_LINK_FULL_DUPLEX;" not in s:
              raise SystemExit("Ethernet patch failed")

          print("BO2 network patch applied.")
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Configure CMake 3.30.3
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.30.3" >> local.properties
          cat local.properties
          "$ANDROID_SDK_ROOT/cmake/3.30.3/bin/cmake" --version

      - name: Build XenDroid APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Show APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XenDroid-BO2-OnePlayer
          path: app/build/outputs/apk/debug/*.apk
